<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Мир Колец — интерактивная карта</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><img class="brand-mark" src="assets/icons/brand.svg" alt=""><span>МИР КОЛЕЦ</span></div>
    <div class="top-actions"><button class="download-btn developer-only" id="download-locations" type="button">Скачать все точки</button><button class="download-btn developer-only" id="download-descriptions" type="button">Скачать все Markdown</button><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Переключить на тёмную тему" title="Переключить на тёмную тему" aria-pressed="false"><svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z"></path></svg></button><a class="discord-link" href="https://discord.gg/6EfNNyTAvt" target="_blank" rel="noopener noreferrer" aria-label="Открыть Discord-сервер" title="Discord-сервер"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.4 5.1a16 16 0 0 0-4-1.3l-.5 1a14 14 0 0 0-5.8 0l-.5-1a16 16 0 0 0-4 1.3C2.1 9 1.4 12.8 1.8 16.5a16 16 0 0 0 4.9 2.5l1.1-1.8-1.7-.8.4-.3a11.5 11.5 0 0 0 11 0l.4.3-1.7.8 1.1 1.8a16 16 0 0 0 4.9-2.5c.5-4.3-.8-8-2.8-11.4ZM8.8 14.5c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8Zm6.4 0c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8Z"></path></svg></a></div>
  </header>
  <main class="main">
    <section class="map-area">
      <div id="map"></div>
      <div class="mode-switch" id="mode-switch"></div>
      <div class="map-tools">
        <button class="tool-btn developer-only" id="add-point" title="Добавить точку" aria-label="Добавить точку" aria-pressed="false">✚</button>
        <div class="map-nav-group zoom-group" role="group" aria-label="Масштаб карты">
          <button class="tool-btn navigation-btn" id="zoom-in" title="Приблизить" aria-label="Приблизить">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5M10.8 7.5v6.6M7.5 10.8h6.6"></path></svg>
          </button>
          <button class="tool-btn navigation-btn" id="zoom-out" title="Отдалить" aria-label="Отдалить">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5M7.5 10.8h6.6"></path></svg>
          </button>
        </div>
        <div class="map-nav-group" role="group" aria-label="Навигация по карте">
          <button class="tool-btn navigation-btn" id="reset-view" title="Показать всю карту" aria-label="Показать всю карту">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg>
          </button>
          <button class="tool-btn navigation-btn" id="show-selected" title="Показать выбранную точку на карте" aria-label="Показать выбранную точку на карте" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path></svg>
          </button>
          <button class="tool-btn navigation-btn" id="random-location" title="Перейти к случайной видимой точке" aria-label="Перейти к случайной видимой точке" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 5h2.5a5 5 0 0 1 4 2l5 8a5 5 0 0 0 4 2H21"></path><path d="m18 14 3 3-3 3M3 19h2.5a5 5 0 0 0 4-2l1-1M14 8l.5-.8a5 5 0 0 1 4-2H21"></path><path d="m18 2 3 3-3 3"></path></svg>
          </button>
        </div>
      </div>
      <div class="map-message" id="map-message" role="status" aria-live="polite" hidden></div>
    </section>
    <div class="sidebar-resizer" id="sidebar-resizer" role="separator" aria-label="Изменить ширину бокового меню" aria-orientation="vertical" aria-valuemin="280" aria-valuemax="640" aria-valuenow="360" tabindex="0"></div>
    <aside class="sidebar">
      <div class="search-wrap"><input class="search" id="search" placeholder="Найти объект..." autocomplete="off"></div>
      <section class="marker-visibility">
        <div class="marker-category-list">
          <label class="visibility-category visibility-all"><input id="markers-visible" type="checkbox" checked><span>Все значки</span></label>
          <div class="marker-category-items" id="marker-categories"></div>
        </div>
      </section>
      <div class="object-list" id="object-list"></div>
      <section class="detail" id="detail"></section>
    </aside>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
